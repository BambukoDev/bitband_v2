[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor -L defmt --chip esp32s3 -p /dev/ttyACM1"

[env]
DEFMT_LOG="info"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "force-frame-pointers",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
